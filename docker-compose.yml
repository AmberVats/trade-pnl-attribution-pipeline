services:
  postgres:
    image: postgres:16
    container_name: trade_pnl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade_pnl
      POSTGRES_USER: trade_user
      POSTGRES_PASSWORD: trade_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: